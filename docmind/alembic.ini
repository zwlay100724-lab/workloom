# DocMind 的 Alembic 配置。
#
# 和 taskflow 同构,但只保留真正需要的项(去掉默认模板一大坨注释)。
# 【数据库 URL 为什么不写在这?】连接串只对 docmind 这一个 app 有意义,
# 且本地开发是写进 docmind/.env 的;真正取值在 migrations/env.py 里做——
# 那里 load_dotenv() 后把 DATABASE_URL 覆盖进来。这里留空,避免两份配置打架。

[alembic]
# 迁移脚本目录,%(here)s 指本 ini 文件所在目录
script_location = %(here)s/migrations

# 把当前目录(也就是 docmind/)加进 sys.path,
# 这样 env.py 里的 `import app...` / `from shared.db.base import Base` 才找得到包。
# (shared 是 pip editable 安装的,任何目录都能 import;app 要靠这个)
prepend_sys_path = .

# 模板里 revision id 的生成方式走默认即可,不用改

# database URL。实际值由 migrations/env.py 从 .env 读取后覆盖,这里留空。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S