target-version = "py310"
line-length = 100

# Alembic 自动生成的迁移不参与 lint；env.py 仍会检查。
extend-exclude = ["**/migrations/versions"]

[lint]
# 先采用保守但有用的规则集：语法/未定义名/未使用导入/导入排序。
# 后续可以逐步加入 B、UP、RUF 等规则。
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# main.py 必须在 load_dotenv() 之后再 import app/shared；
# Alembic env.py 必须在 load_dotenv() 之后 import 模型；
# eval 脚本必须先插 sys.path / load_dotenv。
"**/app/main.py" = ["E402"]
"**/migrations/env.py" = ["E402"]
"docmind/eval/*.py" = ["E402"]
